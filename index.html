<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Omega University Public Contract PC01-PC10 browser">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'none'; img-src 'self' data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Omega University | Public Contract 01–10</title>
<style>
:root{
 --bg:#071019;--panel:#0c1722;--card:#101e2b;--line:#22374a;--text:#edf6ff;
 --muted:#9db2c5;--cyan:#71d7ff;--green:#74e39a;--red:#ff7d7d;--amber:#f1cc73
}
*{box-sizing:border-box;min-width:0}
html{color-scheme:dark;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow-x:hidden}
main{width:100%;max-width:1320px;margin:auto;padding:14px;display:grid;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:9px}
.cards{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.split{grid-template-columns:minmax(250px,.72fr) minmax(0,1.45fr)}
h1,h2,h3{margin:.2em 0 .55em}
.kicker{color:var(--cyan);font-weight:900;letter-spacing:.08em}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.86rem}
.badge.good{color:var(--green);border-color:var(--green)}
.badge.bad{color:var(--red);border-color:var(--red)}
.badge.warn{color:var(--amber);border-color:var(--amber)}
button,input,select{font:inherit;min-height:44px;max-width:100%;background:#0b1620;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
button{cursor:pointer}
button:hover,button:focus-visible,input:focus-visible,select:focus-visible{border-color:var(--cyan);outline:none}
button.active{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.contract{width:100%;text-align:left;min-height:92px}
.contract.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.contract b{display:block;margin-bottom:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.toolbar label{display:grid;gap:4px}
.search{flex:1 1 250px}
#seriesList{max-height:69vh;overflow:auto}
#postText{white-space:pre-wrap;word-break:break-word;line-height:1.58;font-family:inherit;margin:0;background:#07111a;border:1px solid var(--line);border-radius:12px;padding:14px;max-height:72vh;overflow:auto}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.fixture{display:grid;gap:10px}
.fixture label{display:grid;gap:4px}
.receipt{white-space:pre-wrap;word-break:break-word;max-height:55vh;overflow:auto;background:#06101a;border:1px solid var(--line);border-radius:12px;padding:12px}
.check{padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-top:7px}
.search-results{display:grid;gap:6px;max-height:260px;overflow:auto}
.search-hit{text-align:left;width:100%}
footer{color:var(--muted);font-size:.88rem;padding:4px 2px 18px}
@media(max-width:780px){
 main{padding:8px}.split{grid-template-columns:minmax(0,1fr)}#seriesList{max-height:280px}h1{font-size:1.55rem}.toolbar{align-items:stretch}.toolbar label{width:100%}.toolbar button{width:auto}#contractSelect,#viewSelect,#searchInput{width:100%}
 #postText{max-height:none}
}
</style>
</head>
<body>
<noscript><main><section class="panel"><span class="badge bad">HALT</span> JavaScript is disabled. This page needs JavaScript to run the interactive contracts.</section></main></noscript>
<div id="omega-app"><main><section class="panel"><span class="badge warn">LOADING</span> <span class="muted">If this message stays on screen, the script did not run.</span><pre id="bootError" class="receipt" style="display:none"></pre></section></main></div>

</script>
